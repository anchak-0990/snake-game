<!DOCTYPE html><html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNAKE</title><style>
    body {
        background: #020202;
        color: #00ff41;
        font-family: 'Courier New', monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
        user-select: none;
    }

    .ui {
        margin-bottom: 15px;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 2px;
    }

    #title {
        margin: 0 0 8px;
        font-size: 30px;
        text-shadow: 0 0 10px #00ff41;
    }

    #score {
        font-size: 20px;
        text-shadow: 0 0 10px #00ff41;
    }

    canvas {
        display: block;
        border: 2px solid #00ff41;
        box-shadow: 0 0 30px rgba(0, 255, 65, 0.2);
        background: #000;
        width: min(400px, 90vw);
        height: min(400px, 90vw);
        touch-action: none;
    }

    .cipher-text {
        font-size: 12px;
        color: #004411;
        max-width: 500px;
        width: 90vw;
        word-break: break-all;
        margin-top: 15px;
        height: 40px;
        text-align: center;
    }

    .glitch {
        color: #ff0000;
        text-shadow: 2px 2px #00ff41;
    }

    /* На комп'ютері кнопки НЕ показуємо */
    .controls {
        display: none;
    }

    /* На телефоні/сенсорному пристрої показуємо */
    @media (hover: none) and (pointer: coarse) {
        .controls {
            display: grid;
            grid-template-columns: 55px 55px 55px;
            grid-template-rows: 55px 55px;
            gap: 5px;
            margin-top: 12px;
        }

        .control-btn {
            width: 55px;
            height: 55px;
            background: #020202;
            color: #00ff41;
            border: 2px solid #00ff41;
            font-size: 24px;
            font-family: monospace;
            touch-action: manipulation;
        }

        .control-btn:active {
            background: #00ff41;
            color: #000;
        }

        #up {
            grid-column: 2;
            grid-row: 1;
        }

        #left {
            grid-column: 1;
            grid-row: 2;
        }

        #down {
            grid-column: 2;
            grid-row: 2;
        }

        #right {
            grid-column: 3;
            grid-row: 2;
        }
    }
</style>

</head><body><div class="ui">
    <h1 id="title">SNAKE</h1>
    <div id="score">DATA_RECOVERED: 0%</div>
</div>

<canvas id="gameCanvas" width="400" height="400"></canvas>

<div id="buffer" class="cipher-text">
    SYSTEM_READY... INITIALIZING_DECODE_SEQUENCE...
</div>

<div class="controls">
    <button class="control-btn" id="up">▲</button>
    <button class="control-btn" id="left">◀</button>
    <button class="control-btn" id="down">▼</button>
    <button class="control-btn" id="right">▶</button>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");
    const bufferElement = document.getElementById("buffer");

    let score = 0;

    let snake = [
        { x: 200, y: 200 },
        { x: 190, y: 200 },
        { x: 180, y: 200 }
    ];

    let dx = 10;
    let dy = 0;

    let foodX;
    let foodY;
    let foodChar = "0";

    let gameSpeed = 100;
    let changingDirection = false;
    let gameRunning = true;

    createFood();
    drawInitialGame();
    main();

    document.addEventListener("keydown", changeDirection);

    function drawInitialGame() {
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        drawFood();
        drawSnake();
    }

    function main() {
        if (!gameRunning) return;

        if (didGameEnd()) {
            gameOverEffect();
            return;
        }

        changingDirection = false;
        setTimeout(function onTick() {
            clearCanvas();
            advanceSnake();
            drawFood();
            drawSnake();
            main();
        }, gameSpeed);
    }

    function clearCanvas() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.3)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawSnake() {
        snake.forEach((part, index) => {
            const isHead = index === 0;

            ctx.fillStyle = isHead ? "#00ff41" : "#003311";
            ctx.shadowBlur = isHead ? 15 : 0;
            ctx.shadowColor = "#00ff41";

            const size = isHead ? 14 : 11;
            const offset = isHead ? -2 : -1;

            ctx.fillRect(
                part.x + offset,
                part.y + offset,
                size,
                size
            );
        });

        ctx.shadowBlur = 0;
    }

    function advanceSnake() {
        const head = {
            x: snake[0].x + dx,
            y: snake[0].y + dy
        };

        snake.unshift(head);

        if (snake[0].x === foodX && snake[0].y === foodY) {
            score++;

            const percent = Math.min(score * 5, 100);

            scoreElement.innerText =
                DATA_RECOVERED: ${percent}%;

            updateBuffer();

            if (gameSpeed > 50) {
                gameSpeed -= 2;
            }

            createFood();
        } else {
            snake.pop();
        }
    }

    function didGameEnd() {
        for (let i = 4; i < snake.length; i++) {
            if (
                snake[i].x === snake[0].x &&
                snake[i].y === snake[0].y
            ) {
                return true;
            }
        }

        return (
            snake[0].x < 0 ||
            snake[0].x > canvas.width - 10 ||
            snake[0].y < 0 ||
            snake[0].y > canvas.height - 10
        );
    }

    function createFood() {
        do {
            foodX =
                Math.floor(
                    Math.random() * (canvas.width / 10)
                ) * 10;

            foodY =
                Math.floor(
                    Math.random() * (canvas.height / 10)
                ) * 10;
        } while (
            snake.some(
                part =>
                    part.x === foodX &&
                    part.y === foodY
            )
        );

        foodChar = Math.random() > 0.5 ? "1" : "0";
    }

    function drawFood() {
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 12px monospace";
        ctx.shadowBlur = 10;
        ctx.shadowColor = "#ffffff";

        ctx.fillText(
            foodChar,
            foodX + 1,
            foodY + 10
        );

        ctx.shadowBlur = 0;
    }

    function updateBuffer() {
        const chars = "ABCDEF0123456789<>?/[]{}";
        let str = "";

        for (let i = 0; i < 80; i++) {
            str += chars[
                Math.floor(
                    Math.random() * chars.length
                )
            ];
        }

        bufferElement.innerText =
            "DECODING: " + str;

        bufferElement.style.color = "#00ff41";
    }

    function changeDirection(event) {
        if (!gameRunning || changingDirection) return;

        const key = event.key;

        if (
            (key === "ArrowLeft"  key === "a"  key === "A") &&
            dx !== 10
        ) {
            dx = -10;
            dy = 0;
            changingDirection = true;
        }

        else if (
            (key === "ArrowUp"  key === "w"  key === "W") &&
            dy !== 10
        ) {
            dx = 0;
            dy = -10;
            changingDirection = true;
        }

        else if (
            (key === "ArrowRight"  key === "d"  key === "D") &&
            dx !== -10
        ) {
            dx = 10;
            dy = 0;
            changingDirection = true;
        }
        else if (
            (key === "ArrowDown"  key === "s"  key === "S") &&
            dy !== -10
        ) {
            dx = 0;
            dy = 10;
            changingDirection = true;
        }
    }

    function setDirection(direction) {
        if (!gameRunning || changingDirection) return;

        if (direction === "left" && dx !== 10) {
            dx = -10;
            dy = 0;
            changingDirection = true;
        }

        else if (direction === "up" && dy !== 10) {
            dx = 0;
            dy = -10;
            changingDirection = true;
        }

        else if (direction === "right" && dx !== -10) {
            dx = 10;
            dy = 0;
            changingDirection = true;
        }

        else if (direction === "down" && dy !== -10) {
            dx = 0;
            dy = 10;
            changingDirection = true;
        }
    }

    document.getElementById("up").addEventListener(
        "pointerdown",
        () => setDirection("up")
    );

    document.getElementById("left").addEventListener(
        "pointerdown",
        () => setDirection("left")
    );

    document.getElementById("down").addEventListener(
        "pointerdown",
        () => setDirection("down")
    );

    document.getElementById("right").addEventListener(
        "pointerdown",
        () => setDirection("right")
    );

    let touchStartX = 0;
    let touchStartY = 0;

    canvas.addEventListener("touchstart", event => {
        const touch = event.changedTouches[0];

        touchStartX = touch.clientX;
        touchStartY = touch.clientY;
    }, { passive: true });

    canvas.addEventListener("touchend", event => {
        const touch = event.changedTouches[0];

        const deltaX =
            touch.clientX - touchStartX;

        const deltaY =
            touch.clientY - touchStartY;

        if (
            Math.abs(deltaX) < 20 &&
            Math.abs(deltaY) < 20
        ) {
            return;
        }

        if (Math.abs(deltaX) > Math.abs(deltaY)) {
            setDirection(
                deltaX > 0 ? "right" : "left"
            );
        } else {
            setDirection(
                deltaY > 0 ? "down" : "up"
            );
        }
    }, { passive: true });

    function gameOverEffect() {
        gameRunning = false;

        ctx.fillStyle = "rgba(255, 0, 0, 0.6)";
        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        bufferElement.innerHTML =
            "CRITICAL_ERROR: SYSTEM_HALTED";

        bufferElement.className =
            "cipher-text glitch";

        setTimeout(() => {
            location.reload();
        }, 1500);
    }
</script>

<div style="color:red; font-size:30px;">TEST</div>

<script>
    document.getElementById("title").innerText = "SNAKE TEST";
    document.getElementById("score").innerText = "JAVASCRIPT WORKS";
</script>
    
</body>
</html>
